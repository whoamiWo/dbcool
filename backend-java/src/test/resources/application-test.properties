# Test profile — H2 in-memory + JPA create-drop + Flyway disabled + 真实 password encoder
# 用于 E2E 集成测试和 CI
spring.datasource.url=jdbc:h2:mem:nocobase_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: 用 entity 自动建表,无需 Flyway
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disable: PG-specific migrations 与 H2 不兼容
spring.flyway.enabled=false

# JWT (E2E 测试需要)
app.jwt.secret=ci_jwt_secret_at_least_32_characters_long_for_hs256_algorithm
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=7

# CORS (allow E2E localhost)
app.cors.allowed-origins=http://localhost:8080,http://localhost:5173

# Disable Swagger in test (avoid startup noise)
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=false

# Logging
logging.level.com.nocobase=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
