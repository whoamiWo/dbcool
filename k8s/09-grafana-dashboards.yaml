---
# Grafana Dashboard Provider Config（自动导入 Dashboard）
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-providers
  namespace: nocobase
data:
  providers.yaml: |
    apiVersion: 1
    providers:
      - name: 'NocoBase'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/dashboards/nocobase
