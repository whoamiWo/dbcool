apiVersion: v1
kind: Secret
metadata:
  name: {{ include "dbcool.fullname" . }}-secret
  labels:
    app.kubernetes.io/name: {{ include "dbcool.name" . }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "secret.jwtSecret 必填（至少 32 位随机串）" .Values.secret.jwtSecret | quote }}
  POSTGRES_PASSWORD: {{ required "secret.postgresPassword 必填" .Values.secret.postgresPassword | quote }}
  MINIO_ROOT_USER: {{ required "secret.minioRootUser 必填" .Values.secret.minioRootUser | quote }}
  MINIO_ROOT_PASSWORD: {{ required "secret.minioRootPassword 必填" .Values.secret.minioRootPassword | quote }}
  INTERNAL_SERVICE_TOKEN: {{ required "secret.internalServiceToken 必填" .Values.secret.internalServiceToken | quote }}
