# ============================================================
#  NocoBase 三栈全栈 — Docker Compose
#  用法:
#    docker compose up -d         # 启动全部
#    docker compose down          # 停止
#    docker compose down -v       # 停止并清理数据
#    docker compose logs -f       # 查看日志
#    docker compose ps            # 看状态
# ============================================================
name: nocobase

services:
  # ============================================================
  #  基础设施
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nocobase-postgres
    # PHASE94 🔒-7 PITR：开启 WAL 归档，使"恢复到任意时间点"成为可能。
    # 此前这段配置只放在 docker-compose.override.yml（被 gitignore），
    # 换环境重建就没有 PITR —— 归档配置不是敏感信息，应当纳入版本控制。
    command: >
      postgres -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /var/lib/postgresql/data/pg_archive/%f && cp %p /var/lib/postgresql/data/pg_archive/%f'
      -c max_wal_senders=5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nocobase}
      POSTGRES_USER: ${POSTGRES_USER:-nocobase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD，请在 .env 中配置}
    ports:
      # PHASE100 T2: 端口收敛到 127.0.0.1，不对公网暴露
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nocobase}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nocobase-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      # PHASE100 T2: 端口收敛到 127.0.0.1
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nocobase-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?未设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?未设置 MINIO_ROOT_PASSWORD}
    ports:
      # PHASE100 T2: 端口收敛到 127.0.0.1
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ============================================================
  #  消息队列 — RabbitMQ
  #  PHASE 55 Stage 2 MQ 底座(异步任务/webhook 发布/迁移)依赖;
  #  此前缺失该服务,导致 MQ 相关功能在本地与容器环境均不可用。
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nocobase-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?未设置 RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?未设置 RABBITMQ_PASSWORD}
    ports:
      # PHASE100 T2: 端口收敛到 127.0.0.1
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ============================================================
  #  后端 — Java (核心引擎)
  # ============================================================
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: nocobase-backend-java
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PHASE 57: Java → Python 内部调用令牌，必须与 backend-python 的
      # INTERNAL_SERVICE_TOKEN 一致（用于 /api/ai/embedding 等服务间端点）
      AI_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # PHASE 57: 容器内必须用服务名访问 Python（localhost 指向容器自身，连不通）。
      # 本机直跑 Spring Boot 时用默认 http://localhost:8000 即可。
      AI_SERVICE_URL: http://backend-python:8000
      # PHASE 58: AiAssistantService 的 @Value("${ai.python-url:http://localhost:8000}")
      # 是同类问题的第三处——此前未注入，容器内 AI 端点（ask / generate-outline /
      # polish）会连 localhost 失败。与 AI_SERVICE_URL 指向同一个 Python 服务。
      AI_PYTHON_URL: http://backend-python:8000
      # PHASE 59: AI 助手开关。AiAssistantService L38 @Value("${ai.enabled:false}") 默认 false，
      # 未注入时 callLlm 在 L87 直接返回降级文案（该分支不打日志，日志里看不出原因），
      # 导致 /ask、/generate-outline、/polish 一直显示「AI 服务不可用」。
      AI_ENABLED: "true"
      # PHASE 60: 登录限流阈值可配（GlobalRateLimitProperties 默认 5 次/300s）。
      # 默认保持 5（生产安全）；跑 E2E/CI 时若反复登录被 429 打断，可临时调高：
      #   RATELIMIT_LOGIN_LIMIT=100 docker compose up -d --no-build backend-java
      # 注意：不要在 application-test.properties 里全局放宽 —— GlobalRateLimitFilterE2ETest
      # 依赖默认阈值 5 来断言 429，全局放宽会让该用例失败。
      RATELIMIT_LOGIN_LIMIT: ${RATELIMIT_LOGIN_LIMIT:-5}
      # PHASE64 T3: CRDT 服务地址（容器内用服务名，localhost 指向容器自身会连不通）。
      # RealtimeService 的 @Value("${crdt.service.url:}") 注入此值；未配置时启用降级模式。
      CRDT_SERVICE_URL: http://crdt-service:3100
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nocobase}
      POSTGRES_USER: ${POSTGRES_USER:-nocobase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:?未设置 RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?未设置 RABBITMQ_PASSWORD}
      # PHASE100 T1: 去掉弱口令默认兜底 —— 未设置 JWT_SECRET 时 compose 直接失败，
      # 而不是静默使用 dev 密钥上线。
      JWT_SECRET: ${JWT_SECRET:?未设置 JWT_SECRET，请用 openssl rand -base64 32 生成后写入 .env}
      JAVA_PORT: 8080
      # PHASE100 T6: 告警 SQLite 落命名卷（此前 /tmp 容器重建即丢）
      NOCOBASE_ALERTS_PATH: /data/alerts.db
      # PHASE69: 附件存储 MinIO 配置（容器内用服务名，外部用 localhost）
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_EXTERNAL_URL: ${MINIO_EXTERNAL_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?未设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nocobase}
      # PHASE62 R2: 集成端到端实测配置（勿提交真实密钥，值放 .env）
      # 注意 Spring Boot relaxed binding：dingtalk.app-secret → DINGTALK_APP_SECRET，
      # 写成 APP_DINGTALK_APP_SECRET 不会生效（后端读到的仍是空 → 验签必然 401）。
      DINGTALK_APP_SECRET: ${DINGTALK_APP_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      # PHASE70 T2: 压测时可用 shell 变量临时调高(默认保持生产值，勿改默认)。
      #   RATELIMIT_IM_LIMIT=100000 docker compose up -d backend-java
      # 压完 unset 后重启即恢复默认 30/60s。
      RATELIMIT_IM_LIMIT: ${RATELIMIT_IM_LIMIT:-30}
      RATELIMIT_FILEUPLOAD_LIMIT: ${RATELIMIT_FILEUPLOAD_LIMIT:-10}
      # PHASE131 P95: HikariCP 连接池扩容(20→50),消除连接等待导致的 P95 延迟。
      # 压测实证 20 并发时池饱和(pending=80)、P95 307ms;PG max_connections=100 有余量。
      DB_POOL_MAX: ${DB_POOL_MAX:-50}
      DB_POOL_MIN: ${DB_POOL_MIN:-10}
      # 入站消息默认落到的频道（InboundMessageService#resolveTargetChannel）
      INTEGRATION_INBOUND_DEFAULT_CHANNEL_ID: ${INTEGRATION_INBOUND_DEFAULT_CHANNEL_ID:-}
      # PHASE99 T1: 集成凭证加密主密钥（AES-256，Base64 编码 32 字节）
      # 生成：openssl rand -base64 32
      # 未配置时 CredentialCryptoService 启动即失败（红线 1：禁止硬编码密钥）
      INTEGRATION_CREDENTIAL_MASTER_KEY: ${INTEGRATION_CREDENTIAL_MASTER_KEY:-}
    ports:
      # PHASE100 T2: Java 后端端口收敛到 127.0.0.1，对外仅经 nginx
      - "127.0.0.1:${JAVA_PORT:-8080}:8080"
    volumes:
      # PHASE100 T6: 告警 SQLite 落命名卷（与 backend-python 共用同一份告警库）
      - alertsdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
    # PHASE100 T2: 真实探活 —— readiness 校验 DB + 连接池，而非仅进程存活
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          # PHASE100 T4: Spring Boot 后端 512M 会 OOM，提到 1G
          memory: 1024M
    restart: unless-stopped

  # ============================================================
  #  后端 — Python (AI / 集成)
  # ============================================================
  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
      args:
        # PHASE 57 真语义向量：true = 构建时安装 sentence-transformers(torch)，
        # /api/ai/embedding 使用真语义向量；false(默认) = 回退确定性哈希向量。
        # 启用方式二选一：
        #   1) docker compose build --build-arg INSTALL_SEMANTIC=true backend-python
        #   2) .env 中设置 INSTALL_SEMANTIC=true 后 docker compose build
        INSTALL_SEMANTIC: ${INSTALL_SEMANTIC:-false}
    container_name: nocobase-backend-python
    environment:
      JAVA_BACKEND_URL: http://backend-java:8080
      # PHASE100 T1: 去掉弱口令默认兜底
      JWT_SECRET: ${JWT_SECRET:?未设置 JWT_SECRET}
      # PHASE 57: 服务间调用令牌，必须与 backend-java 的 AI_INTERNAL_TOKEN 一致
      # Java 携带它调用 /api/ai/embedding；未设置时该端点仅接受用户 JWT
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # PHASE 57: 模型已在构建期 (INSTALL_SEMANTIC=true) 下载到 /app/.cache/huggingface。
      # 运行时容器外网不可达，若不禁用联网，SentenceTransformer 每次启动都会尝试
      # 补全 video_preprocessor_config.json 等可选配置 → 5 次重试 × 多文件 → 启动卡死。
      # 离线模式下直接用本地缓存，缺的可选配置走默认值，启动秒起。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      # PHASE 58 P0-1: 备份服务 (pg_dump / redis-cli) 需要连到真实 Postgres 与 Redis。
      # 关键：容器内 localhost 指向容器自身，必须用 compose 服务名，否则备份必然
      # Connection refused(与 AI_SERVICE_URL 硬编码 localhost 是同款问题)。
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nocobase}
      POSTGRES_USER: ${POSTGRES_USER:-nocobase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # PHASE69 R3: MinIO 备份配置
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?未设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?未设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-nocobase}
      # PHASE100 T6: 告警持久化 + webhook 外发通道
      # 路径指向命名卷（不再是 /tmp，容器重启不丢）
      NOCOBASE_ALERTS_PATH: /data/alerts.db
      # 告警 webhook（未配置则仅落盘不外发，启动日志会明确提示）
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_WEBHOOK_KIND: ${ALERT_WEBHOOK_KIND:-generic}
      ALERT_WEBHOOK_SECRET: ${ALERT_WEBHOOK_SECRET:-}
      # PHASE101 T1: 备份目录显式指向挂载点（默认 /tmp/backups 在容器重建后丢失）
      BACKUP_DIR: /app/backups
    ports:
      # PHASE100 T2: Python 后端端口收敛到 127.0.0.1，对外仅经 nginx
      - "127.0.0.1:${PYTHON_PORT:-8000}:8000"
    volumes:
      # PHASE100 T6: 告警 SQLite 落命名卷，重启可恢复
      - alertsdata:/data
      # PHASE101 T1: 备份文件落命名卷（不再是 /tmp/backups，容器重建不丢）
      - backupsdata:/app/backups
    depends_on:
      backend-java:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    # PHASE100 T2: 真实探活 —— readiness 校验 Python 后端 /api/health/ready
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          # PHASE100 T4: Python 后端 768M（含 sentence-transformers）
          memory: 768M
    restart: unless-stopped

  # ============================================================
  #  CRDT 实时协作服务 (PHASE 64 T3)
  # ============================================================
  crdt-service:
    build:
      context: ./crdt-service
      dockerfile: Dockerfile
    container_name: nocobase-crdt-service
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: ${POSTGRES_DB:-nocobase}
      PG_USER: ${POSTGRES_USER:-nocobase}
      PG_PASSWORD: ${POSTGRES_PASSWORD:?未设置 POSTGRES_PASSWORD}
    ports:
      # PHASE100 T2: CRDT 端口收敛到 127.0.0.1
      - "127.0.0.1:${CRDT_PORT:-3100}:3100"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # ============================================================
  #  前端 — Nginx 静态服务 + 反向代理
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nocobase-frontend
    environment:
      API_BASE_URL: /
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      FRONTEND_BIND_ADDR: ${FRONTEND_BIND_ADDR:-127.0.0.1}
      FRONTEND_PORT: ${FRONTEND_PORT:-80}
      FRONTEND_TLS_PORT: ${FRONTEND_TLS_PORT:-443}
    ports:
      # PHASE100 T2: 前端端口收敛，默认 127.0.0.1（仅内网反代）；IP 直连模式在 .env 中改为 0.0.0.0
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
      # PHASE113: https 入口（自签证书挂载在下方 volumes）
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_TLS_PORT:-443}:443"
    volumes:
      # PHASE113 / PHASE114: 内部 POC 用自签名证书（CN=localhost）；
      # 域名模式启用 443 ssl；IP 模式时 nginx 不引用证书但仍可挂载占位文件避免启动循环
      - ./certs/fullchain.pem:/etc/nginx/certs/fullchain.pem:ro
      - ./certs/privkey.pem:/etc/nginx/certs/privkey.pem:ro
    depends_on:
      backend-java:
        condition: service_healthy
      backend-python:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - nocobase-net
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

volumes:
  pgdata:
    name: nocobase-pgdata
  redisdata:
    name: nocobase-redisdata
  miniodata:
    name: nocobase-miniodata
  rabbitmqdata:
    name: nocobase-rabbitmqdata
  # PHASE100 T6: 告警 SQLite 持久化（命名卷，容器重建不丢）
  alertsdata:
    name: nocobase-alertsdata
  # PHASE101 T1: 备份文件持久化（命名卷，容器重建不丢）
  backupsdata:
    name: nocobase-backupsdata

networks:
  nocobase-net:
    name: nocobase-net
    driver: bridge
