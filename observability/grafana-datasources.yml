# ============================================================
#  Grafana 数据源配置（PHASE104 T7.3 / PHASE104 审计修正）
#
#  ⚠️ 本文件只含 datasources —— 挂载到 provisioning/datasources/。
#     dashboards / dashboardProviders 属于 dashboard provider schema，
#     Grafana **不会**从本路径读取这两个字段（此前误放在此导致面板不导入）。
#     面板 provider 已移至同目录 dashboards/dashboards.yml。
# ============================================================

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    is_default: true
    editable: true
    jsonData:
      timeInterval: '30s'
