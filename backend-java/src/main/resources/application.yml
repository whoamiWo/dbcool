spring:
  application:
    name: nocobase-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nocobase}
    username: ${POSTGRES_USER:nocobase}
    password: ${POSTGRES_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: nocobase-pool
      # R09: 生产级连接池参数(防耗尽 / 防泄漏 / 自动回收)
      # PHASE131: 20 → 50。压测实证 20 并发时池饱和(pending=80)、P95 307ms。
      # PHASE134: 上调至 80。上限受 PG max_connections=100 约束(需为其他
      #   服务/维护连接预留约 20),故不能再增。
      # PHASE135 结论:50 VU P95 未达标(~543ms,4 轮中位数),且已排除配额写路径
      #   (flush 降频 5s→60s、移除每分钟全表 reset)与连接池为主要瓶颈。
      #   长尾需 profiling 定位(业务查询/GC/宿主机争抢),见
      #   docs/PERF_PROFILING_REPORT.md「瓶颈重新定位」。未定位前维持 80。
      maximum-pool-size: ${DB_POOL_MAX:80}
      minimum-idle: ${DB_POOL_MIN:20}
      connection-timeout: 30000          # 获取连接最长等待 30s
      max-lifetime: 1800000              # 连接最长存活 30min(低于 PG 默认,避免 stale 连接)
      idle-timeout: 600000               # 空闲 10min 回收
      validation-timeout: 5000           # 连接有效性校验超时
      leak-detection-threshold: 60000    # 连接被持有 >60s 记 WARN 堆栈(定位泄漏)
      initialization-fail-timeout: 1     # 启动不因连接池预热阻塞

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Week 41 D6 Step G2:ADR-007 Schema 隔离(零迁移策略)
        # schema 由 TenantIdentifierResolver 提供,SET search_path 由
        # SchemaTenantConnectionProvider 执行;默认租户映射 public → 存量数据无需迁移
        multiTenancy: SCHEMA  # Week 42 G2 完成后启用(同上下面的 multi_tenant_* 配置)
        # ⏭️ Week 41 G2 partial — SchemaTenantConnectionProvider + TenantIdentifierResolver
        # 已写但未启用(Hibernate Class.forName 创建实例时 Spring Bean 尚未注入 DataSource,
        # 需用 ServiceContributor 桥接,推迟到 Week 42 G2 完成)
        # multi_tenant_connection_provider: com.nocobase.tenant.SchemaTenantConnectionProvider
        # multi_tenant_identifier_resolver: com.nocobase.tenant.TenantIdentifierResolver
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # 注：V58 曾尝试 CREATE INDEX CONCURRENTLY + execute-in-transaction=false，
    # 但在单机 Docker 部署下 HikariCP(autoCommit=false) 与 CONCURRENTLY 的
    # SHARE UPDATE EXCLUSIVE 锁互斥，导致启动卡死。经评估当前数据量级
    # （ai_conversation < 10 万行）普通 CREATE INDEX 锁表 < 100ms，故 V58
    # 回退为普通 CREATE INDEX，此处不再需要关闭事务/开启自动提交。

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # PHASE136: Caffeine 本地缓存（collectionList 缓存 TTL 5s，最多 200 租户，开启统计）
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=200,expireAfterAccess=5s,recordStats

server:
  port: ${JAVA_PORT:8080}
  shutdown: graceful

# PHASE99 T1: 集成凭证加密密钥（环境变量注入，禁止硬编码）
# 生成方式：openssl rand -base64 32
integration:
  credential:
    master-key: ""

# JWT 配置
app:
  # R09: 连接池监控参数
  pool-monitor:
    warn-utilization: 0.85     # 活跃连接占比达到 85% 触发 WARN
    interval-ms: 30000        # 扫描间隔 30s
  # Stage 1 安全收口:ACL fail-open 开关。
  # false(默认)=fail-closed(无策略/异常一律拒绝);true=灰度回滚窗口用。
  acl:
    fail-open: ${ACL_FAIL_OPEN:false}

  # 钉钉集成配置(Week 1-4 Phase 4)
  # 凭证从钉钉开发者后台获取: https://open-dev.dingtalk.com
  dingtalk:
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    agent-id: ${DINGTALK_AGENT_ID:}
    corp-id: ${DINGTALK_CORP_ID:}
  jwt:
    # PHASE114: 移除 dev 占位默认值 —— 未注入 JWT_SECRET 直接启动失败(fail fast),
    # 与 docker-compose 的 ${JWT_SECRET:?} 及 KeyRingService 硬阻断对齐。
    # 本地开发:export JWT_SECRET=$(openssl rand -hex 32)
    # 测试:application-test.properties 提供 ci_jwt_secret 专用值
    secret: ${JWT_SECRET:?JWT_SECRET 环境变量未设置,参见 DEPLOY.md}
    # Week 42 R10:轮换期间保留上一个签名密钥,旧 kid 仍可验证
    # 真实部署应由 KMS 注入 — 本地测试可留空
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000

  # PHASE10: OIDC 通用 SSO（企业身份源：Keycloak / Azure AD / Okta / AD FS）
  # 采用授权码流程：认证成功后由 OidcLoginSuccessHandler 签发**本地 JWT**
  # 并重定向前端，前端零改造（继续用本地 JWT）。
  # 未配置（enabled=false 或缺 issuer-uri/client-id）时完全不注册，
  # 不影响既有账密 / 钉钉 / 飞书登录链路。
  oidc:
    enabled: ${OIDC_ENABLED:false}
    # IdP 发现地址，例 Keycloak: http://keycloak:8080/realms/{realm}
    issuer-uri: ${OIDC_ISSUER_URI:}
    client-id: ${OIDC_CLIENT_ID:}
    client-secret: ${OIDC_CLIENT_SECRET:}
    scope: ${OIDC_SCOPE:openid,profile,email}
    # 登录成功后重定向前端的地址（自动拼接 ?token=<jwt>）
    success-redirect: ${OIDC_SUCCESS_REDIRECT:http://localhost:5173/oidc/callback}

# Actuator(健康检查 + 可观测性)—— PHASE 55 P0
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      # 开启 K8s readiness/liveness 分组(/actuator/health/readiness、/liveness)
      probes:
        enabled: true
  metrics:
    # 全局 tag,便于 Prometheus/Grafana 按应用/租户聚合
    tags:
      application: ${spring.application.name:nocobase}
    distribution:
      # 记录 P95/P99,用于 SLO 观测(默认仅 count/sum/max)
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,1s,3s
  # PHASE 56 P1-2 分布式追踪：OpenTelemetry + Jaeger
  # PHASE100 T7 修正：Compose 部署下**没有 OTel Collector**，otlp.endpoint 指向
  # localhost:4318 时 span 会被静默丢弃（红线 5：禁止留下静默丢弃）。
  # 因此采样概率默认改为 **0（显式关闭）**；需要追踪时先部署 collector，
  # 再通过 TRACING_SAMPLING_RATE 调高（例如 0.1）。
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_RATE:0}
    otlp:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# Springdoc / Swagger UI(Week 14.5)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    persist-authorization: true
  show-actuator: false
  packages-to-scan: com.nocobase
  default-produces-media-type: application/json

# 日志
logging:
  level:
    root: INFO
    com.nocobase: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      # Week 42 D5.2: H2 测试环境无 Flyway → 用 create-drop 自动建表
      # (生产 dev profile 仍用 validate + Flyway，保持 schema 一致性)
      ddl-auto: create-drop

# Phase 60 T3-1: 测试环境关闭限流过滤器 (避免 WebMvcTest 加载失败)
ratelimit:
  enabled: false

---
# Docker profile — 与 dev 一样但日志更克制
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false
  # PHASE69: 生产环境关闭 Swagger UI
  # PHASE95 R4: api-docs 也关闭 — 匿名 curl /v3/api-docs 必须 401/403/404
  springdoc:
    swagger-ui:
      enabled: ${SPRINGDOC_SWAGGER_ENABLED:false}
    api-docs:
      enabled: ${SPRINGDOC_API_DOCS_ENABLED:false}

logging:
  level:
    com.nocobase: INFO

# Phase 60 T3-1: 全局 API 限流配置
ratelimit:
  enabled: true
  login:
    limit: 5
    window-seconds: 300
  im:
    limit: 30
    window-seconds: 60
  file-upload:
    limit: 10
    window-seconds: 60
  # PHASE99 T2: 第三方回调入站限流（匿名放行端点防刷）
  inbound:
    limit: 60
    window-seconds: 60

# PHASE69: MinIO 配置 (app.storage.minio prefix for @ConfigurationProperties)
app:
  storage:
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:}
      external-url: ${MINIO_EXTERNAL_URL:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:nocobase}
      max-file-size: ${MINIO_MAX_FILE_SIZE_MB:100}
      allowed-content-types: ${MINIO_ALLOWED_CONTENT_TYPES:image/png,image/jpeg,image/gif,application/pdf,text/plain}

# C4: AI 多模型支持 — 可用模型列表(逗号分隔,第一个为默认模型)
# Python LLM 网关侧按需扩展新模型时,仅需在此追加
ai:
  enabled: ${AI_ENABLED:false}
  python-url: ${AI_PYTHON_URL:http://localhost:8000}
  model: ${AI_MODEL:gpt-4o}
  max-tokens: ${AI_MAX_TOKENS:1024}
  models: ${AI_MODELS:gpt-4o,gpt-4o-mini,claude-3-5-sonnet,qwen-max,deepseek-chat}
