name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  JAVA_VERSION: "21"

jobs:
  # ============================================================
  #  Java 后端测试
  # ============================================================
  java-test:
    name: ☕ Java Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nocobase_test
          POSTGRES_USER: nocobase
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Java tests (test profile, H2)
        working-directory: backend-java
        run: mvn test -B -Dspring.profiles.active=test

      - name: Upload Java coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: java-coverage
          path: backend-java/target/site/jacoco/
          retention-days: 7

  # ============================================================
  #  Python 后端测试
  # ============================================================
  python-test:
    name: 🐍 Python Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        working-directory: backend-python
        run: uv sync --all-extras

      - name: Lint
        working-directory: backend-python
        run: |
          uv run ruff check .
          uv run mypy .

      - name: Run tests with coverage
        working-directory: backend-python
        run: uv run pytest -v --cov=src --cov-report=xml --cov-report=term

      - name: Upload Python coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: backend-python/coverage.xml
          retention-days: 7

  # ============================================================
  #  前端测试
  # ============================================================
  frontend-test:
    name: 🌐 Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Lint & Type check
        working-directory: frontend
        run: |
          pnpm lint
          pnpm tsc --noEmit

      - name: Run tests
        working-directory: frontend
        run: pnpm test:run

      - name: Run tests with coverage
        working-directory: frontend
        run: pnpm test:coverage

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  frontend-e2e:
    name: 🎭 Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Run E2E tests
        working-directory: frontend
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7

  build:
    name: 🏗 Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@9.12.0 --activate

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: frontend
        run: pnpm build

  # ============================================================
  #  契约文件静态校验
  # ============================================================
  contract-static:
    name: 📜 Contract Static Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install contract test deps
        working-directory: tests/contract
        run: uv sync

      - name: Run static contract tests
        working-directory: tests/contract
        run: uv run pytest -v -m "not integration"

  # ============================================================
  #  契约集成测试(需启动 Java 后端)
  # ============================================================
  contract-integration:
    name: 🔌 Contract Integration
    runs-on: ubuntu-latest
    needs: [java-test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nocobase
          POSTGRES_USER: nocobase
          POSTGRES_PASSWORD: dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Build Java jar
        working-directory: backend-java
        run: mvn clean package -DskipTests

      - name: Start Java backend
        working-directory: backend-java
        run: |
          SPRING_PROFILES_ACTIVE=dev \
          POSTGRES_HOST=localhost \
          POSTGRES_PORT=5432 \
          POSTGRES_DB=nocobase \
          POSTGRES_USER=nocobase \
          POSTGRES_PASSWORD=dev_password \
          JWT_SECRET=ci_jwt_secret_at_least_32_characters_long \
          nohup java -jar target/*.jar > /tmp/java.log 2>&1 &
          echo $! > /tmp/java.pid

      - name: Wait for Java to be ready
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/api/health > /dev/null; then
              echo "Java ready after ${i}s"
              exit 0
            fi
            sleep 2
          done
          echo "Java failed to start"
          cat /tmp/java.log
          exit 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install contract test deps
        working-directory: tests/contract
        run: uv sync

      - name: Run integration contract tests
        working-directory: tests/contract
        run: TARGET_URL=http://localhost:8080 uv run pytest -v

      - name: Show Java logs on failure
        if: failure()
        run: tail -100 /tmp/java.log

      - name: Cleanup Java process
        if: always()
        run: |
          if [ -f /tmp/java.pid ]; then
            kill $(cat /tmp/java.pid) 2>/dev/null || true
          fi
