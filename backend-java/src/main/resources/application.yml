spring:
  application:
    name: nocobase-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nocobase}
    username: ${POSTGRES_USER:nocobase}
    password: ${POSTGRES_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Week 41 D6 Step G2:ADR-007 Schema 隔离(零迁移策略)
        # schema 由 TenantIdentifierResolver 提供,SET search_path 由
        # SchemaTenantConnectionProvider 执行;默认租户映射 public → 存量数据无需迁移
        multiTenancy: SCHEMA
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${JAVA_PORT:8080}
  shutdown: graceful

# JWT 配置
app:
  jwt:
    secret: ${JWT_SECRET:dev_jwt_secret_at_least_32_characters_long_for_hs256}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  # Week 41 复核 D1.4:附件对象存储(MinIO / S3 兼容)
  # 默认关闭 —— 未启用时附件端点返 501,与改造前一致,不会因缺少 MinIO 而启动失败
  storage:
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:nocobase}

# Actuator(健康检查)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Springdoc / Swagger UI(Week 14.5)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    persist-authorization: true
  show-actuator: false
  packages-to-scan: com.nocobase
  default-produces-media-type: application/json

# 日志
logging:
  level:
    root: INFO
    com.nocobase: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false

---
# Docker profile — 与 dev 一样但日志更克制
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false

logging:
  level:
    com.nocobase: INFO
