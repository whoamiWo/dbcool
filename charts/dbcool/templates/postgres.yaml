apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "dbcool.fullname" . }}-postgres
  labels:
    {{- include "dbcool.labels" . | nindent 4 }}
    app: postgres
spec:
  serviceName: {{ include "dbcool.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "nocobase"
            - name: POSTGRES_DB
              value: "nocobase"
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ include "dbcool.fullname" . }}-secret, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_INITDB_ARGS
              value: "--encoding=UTF8 --locale=C"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "nocobase"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbcool.fullname" . }}-postgres
  labels:
    {{- include "dbcool.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
