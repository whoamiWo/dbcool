# ============================================================
#  Grafana 面板配置 —— 基于已有 Prometheus 指标
#  PHASE 56 P1-3
#
#  使用说明：
#  1. 确保集群已安装 Grafana（可通过 helm install grafana grafana/grafana）
#  2. 应用此文件：kubectl apply -f k8s/09-grafana-dashboards.yaml
#  3. 登录 Grafana UI (http://grafana:3000)，默认 admin/admin
#  4. 添加 Prometheus 数据源：URL=http://prometheus-server:9090
#  5. Dashboard 会自动导入（ConfigMap 标签匹配）
# ============================================================

---
# Grafana ConfigMap（Dashboard JSON）
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-nocobase
  namespace: nocobase
  labels:
    grafana_dashboard: "true"  # Grafana Operator 会自动发现
data:
  nocobase-overview.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "color": {
                "mode": "palette-classic"
              },
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 80
