# CRDT 服务端合并服务
# 提供 Yjs 文档的服务端合并 + 持久化功能
# 依赖 PostgreSQL (nocobase-postgres)，建议与主集群同 VPC

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crdt-service
  labels:
    app: crdt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crdt-service
  template:
    metadata:
      labels:
        app: crdt-service
    spec:
      containers:
        - name: crdt-service
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - containerPort: 3100
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef:
                  name: nocobase-secrets
                  key: postgres-host
            - name: PG_PORT
              value: "5432"
            - name: PG_DB
              valueFrom:
                secretKeyRef:
                  name: nocobase-secrets
                  key: postgres-db
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: nocobase-secrets
                  key: postgres-user
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nocobase-secrets
                  key: postgres-password
            - name: PORT
              value: "3100"
          volumeMounts:
            - name: yjs-store
              mountPath: /app/yjs-store
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: yjs-store
          persistentVolumeClaim:
            claimName: crdt-service-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: crdt-service
  labels:
    app: crdt-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3100
      name: http
  selector:
    app: crdt-service

---
# 持久化卷 (Yjs 文档状态)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crdt-service-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard