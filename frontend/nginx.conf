# ============================================================
#  NocoBase 前端 — Nginx 配置
#  用法:
#    /api/*        → 反代到 Java 后端(8080)
#    /api/ai/*     → 反代到 Python 后端(8000)
#    其他          → 静态资源(SPA)
#
#  PHASE100 T3: TLS + 真实探活
#    - 443 监听（证书通过挂载提供，路径走环境变量，不入库）
#    - 80 永久跳转 443 + HSTS
#    - /health 改为**真实探活**（探后端 /api/health，不是 return 200 假阳性）
# ============================================================

# HTTP → HTTPS 跳转（PHASE100 T3）
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # PHASE100 T3: 证书路径（挂载提供，不入库）
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # PHASE100 T3: HSTS（2 年，含子域名）
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # PHASE115 安全响应头（防点击劫持、MIME 嗅探、Referrer 泄露、CSP）
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 说明（PHASE121）：
    #   default-src 'self' —— 默认所有资源仅同源；connect-src 额外放行 wss/ws（WebSocket）
    #   script-src 保留 'unsafe-inline'/'unsafe-eval' —— Vite 构建产物含内联启动脚本，
    #     React 运行时与部分依赖需 eval 动态构造样式，移除会导致页面白屏
    #   style-src 保留 'unsafe-inline' —— 样式库运行时会注入 <style> 标签
    #   收紧迁移路径：构建期生成 nonce/hash 注入 index.html，逐步移除 unsafe-*
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;

    root /usr/share/nginx/html;
    index index.html;

    # 启用 gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Java 后端
    location /api/ {
        proxy_pass http://backend-java:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Python 后端(AI 端点)
    # 注意:必须放在 /api/ 之前,否则会被 /api/ 截获
    location /api/ai/ {
        proxy_pass http://backend-python:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 静态资源
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # 本块有 add_header，会阻断 server 级安全头继承，故此处重复声明
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # CSP 说明（PHASE121）：
        #   default-src 'self' —— 默认所有资源仅同源；connect-src 额外放行 wss/ws（WebSocket）
        #   script-src 保留 'unsafe-inline'/'unsafe-eval' —— Vite 构建产物含内联启动脚本，
        #     React 运行时与部分依赖需 eval 动态构造样式，移除会导致页面白屏
        #   style-src 保留 'unsafe-inline' —— 样式库运行时会注入 <style> 标签
        #   收紧迁移路径：构建期生成 nonce/hash 注入 index.html，逐步移除 unsafe-*
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' wss: ws:; frame-ancestors 'none'; form-action 'self'; base-uri 'self';" always;
        try_files $uri =404;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # PHASE100 T3: 真实探活 —— 后端挂掉时返回 502，不再是假 200
    location /health {
        proxy_pass http://backend-java:8080/api/health;
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        access_log off;
    }
}
