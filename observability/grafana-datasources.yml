# ============================================================
#  Grafana 配置（PHASE104 T7.3）—— 数据源 + 初始化面板
#
#  默认账号：admin / admin（首次登录后强制修改）
#  数据源：Prometheus（自动创建）
# ============================================================

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    is_default: true
    editable: true
    jsonData:
      timeInterval: '30s'

# Dashboard 导入（JSON 文件放在 grafana/dashboards/）
dashboards:
  - name: 'NocoBase Overview'
    orgId: 1
    folder: 'NocoBase'
    type: file
    file: /etc/grafana/provisioning/dashboards/nocobase-overview.json
    allowUiUpdates: true

dashboardProviders:
  - name: 'default'
    orgId: 1
    folder: ''
    type: file
    options:
      path: /etc/grafana/provisioning/dashboards
