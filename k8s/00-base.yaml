# ============================================================
#  NocoBase K8s 基础：Namespace / ConfigMap / Secret
#  PHASE 55 P0 可观测性与编排
# ============================================================

---
apiVersion: v1
kind: Namespace
metadata:
  name: nocobase
  labels:
    app.kubernetes.io/name: nocobase

---
# 非敏感配置（供所有工作负载引用）
apiVersion: v1
kind: ConfigMap
metadata:
  name: nocobase-config
  namespace: nocobase
data:
  # ---- 应用 ----
  SPRING_PROFILES_ACTIVE: "prod"
  JAVA_PORT: "8080"
  PYTHON_PORT: "8000"
  # ---- 数据库 ----
  POSTGRES_HOST: "postgres.nocobase.svc.cluster.local"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "nocobase"
  # ---- 缓存 ----
  REDIS_HOST: "redis.nocobase.svc.cluster.local"
  REDIS_PORT: "6379"
  # ---- 消息队列（PHASE 55 Stage 2 MQ 底座依赖）----
  RABBITMQ_HOST: "rabbitmq.nocobase.svc.cluster.local"
  RABBITMQ_PORT: "5672"
  # ---- 对象存储 ----
  MINIO_ENDPOINT: "http://minio.nocobase.svc.cluster.local:9000"
  # ---- 服务间调用 ----
  JAVA_BACKEND_URL: "http://backend-java.nocobase.svc.cluster.local:8080"
  API_BASE_URL: "/"

---
# 敏感配置 —— ⚠️ 生产部署请改用 SealedSecret（见 docs/secrets-management.md 与
# scripts/seal-secrets.sh，产物 k8s/sealed/secret.yaml）并跳过本段 Secret，
# 避免与 controller 生成的 nocobase-secret 重名冲突。
# 本文件中的占位符仅供本地开发/演示（CHANGE_ME 值不可用于生产）。
apiVersion: v1
kind: Secret
metadata:
  name: nocobase-secret
  namespace: nocobase
type: Opaque
stringData:
  # ⚠️ 以下均为占位符，生产环境必须替换
  POSTGRES_USER: "nocobase"
  POSTGRES_PASSWORD: "CHANGE_ME"
  JWT_SECRET: "CHANGE_ME_at_least_32_characters_long_for_hs256"
  MINIO_ROOT_USER: "CHANGE_ME"
  MINIO_ROOT_PASSWORD: "CHANGE_ME"
  RABBITMQ_USER: "guest"
  RABBITMQ_PASSWORD: "CHANGE_ME"
  # 第三方平台凭证（占位符；生产请用 Sealed Secrets / Vault 注入，见待办池 #4）
  DINGTALK_APP_KEY: "CHANGE_ME"
  DINGTALK_APP_SECRET: "CHANGE_ME"
  FEISHU_APP_ID: "CHANGE_ME"
  FEISHU_APP_SECRET: "CHANGE_ME"
  FEISHU_ENCRYPT_KEY: "CHANGE_ME"
  WECOM_CORP_ID: "CHANGE_ME"
  WECOM_SECRET: "CHANGE_ME"
  WECHAT_APP_ID: "CHANGE_ME"
  WECHAT_APP_SECRET: "CHANGE_ME"
  SLACK_CLIENT_ID: "CHANGE_ME"
  SLACK_CLIENT_SECRET: "CHANGE_ME"
  SLACK_SIGNING_SECRET: "CHANGE_ME"
  SLACK_BOT_TOKEN: "CHANGE_ME"
