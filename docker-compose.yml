# ============================================================
#  NocoBase 三栈全栈 — Docker Compose
#  用法:
#    docker compose up -d         # 启动全部
#    docker compose down          # 停止
#    docker compose down -v       # 停止并清理数据
#    docker compose logs -f       # 查看日志
#    docker compose ps            # 看状态
# ============================================================
name: nocobase

services:
  # ============================================================
  #  基础设施
  # ============================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nocobase-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nocobase}
      POSTGRES_USER: ${POSTGRES_USER:-nocobase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-nocobase}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nocobase-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nocobase-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - nocobase-net
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nocobase-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nocobase-net
    restart: unless-stopped

  # ============================================================
  #  消息队列 — RabbitMQ
  #  PHASE 55 Stage 2 MQ 底座(异步任务/webhook 发布/迁移)依赖;
  #  此前缺失该服务,导致 MQ 相关功能在本地与容器环境均不可用。
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: nocobase-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nocobase-net
    restart: unless-stopped

  # ============================================================
  #  后端 — Java (核心引擎)
  # ============================================================
  backend-java:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: nocobase-backend-java
    environment:
      SPRING_PROFILES_ACTIVE: docker
      # PHASE 57: Java → Python 内部调用令牌，必须与 backend-python 的
      # INTERNAL_SERVICE_TOKEN 一致（用于 /api/ai/embedding 等服务间端点）
      AI_INTERNAL_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # PHASE 57: 容器内必须用服务名访问 Python（localhost 指向容器自身，连不通）。
      # 本机直跑 Spring Boot 时用默认 http://localhost:8000 即可。
      AI_SERVICE_URL: http://backend-python:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-nocobase}
      POSTGRES_USER: ${POSTGRES_USER:-nocobase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_at_least_32_characters_long_for_hs256}
      JAVA_PORT: 8080
      NOCOBASE_ALERTS_PATH: /tmp/alerts.db
    ports:
      - "${JAVA_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - nocobase-net
    restart: unless-stopped

  # ============================================================
  #  后端 — Python (AI / 集成)
  # ============================================================
  backend-python:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
      args:
        # PHASE 57 真语义向量：true = 构建时安装 sentence-transformers(torch)，
        # /api/ai/embedding 使用真语义向量；false(默认) = 回退确定性哈希向量。
        # 启用方式二选一：
        #   1) docker compose build --build-arg INSTALL_SEMANTIC=true backend-python
        #   2) .env 中设置 INSTALL_SEMANTIC=true 后 docker compose build
        INSTALL_SEMANTIC: ${INSTALL_SEMANTIC:-false}
    container_name: nocobase-backend-python
    environment:
      JAVA_BACKEND_URL: http://backend-java:8080
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_at_least_32_characters_long_for_hs256}
      # PHASE 57: 服务间调用令牌，必须与 backend-java 的 AI_INTERNAL_TOKEN 一致
      # Java 携带它调用 /api/ai/embedding；未设置时该端点仅接受用户 JWT
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-}
      # PHASE 57: 模型已在构建期(INSTALL_SEMANTIC=true)下载到 /app/.cache/huggingface。
      # 运行时容器外网不可达，若不禁用联网，SentenceTransformer 每次启动都会尝试
      # 补全 video_preprocessor_config.json 等可选配置 → 5 次重试 × 多文件 → 启动卡死。
      # 离线模式下直接用本地缓存，缺的可选配置走默认值，启动秒起。
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    ports:
      - "${PYTHON_PORT:-8000}:8000"
    depends_on:
      - backend-java
    networks:
      - nocobase-net
    restart: unless-stopped

  # ============================================================
  #  前端 — Nginx 静态服务 + 反向代理
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nocobase-frontend
    environment:
      API_BASE_URL: /
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend-java
      - backend-python
    networks:
      - nocobase-net
    restart: unless-stopped

volumes:
  pgdata:
    name: nocobase-pgdata
  redisdata:
    name: nocobase-redisdata
  miniodata:
    name: nocobase-miniodata
  rabbitmqdata:
    name: nocobase-rabbitmqdata

networks:
  nocobase-net:
    name: nocobase-net
    driver: bridge
