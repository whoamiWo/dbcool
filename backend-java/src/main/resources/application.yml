spring:
  application:
    name: nocobase-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:nocobase}
    username: ${POSTGRES_USER:nocobase}
    password: ${POSTGRES_PASSWORD:dev_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: nocobase-pool
      # R09: 生产级连接池参数(防耗尽 / 防泄漏 / 自动回收)
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: ${DB_POOL_MIN:5}
      connection-timeout: 30000          # 获取连接最长等待 30s
      max-lifetime: 1800000              # 连接最长存活 30min(低于 PG 默认,避免 stale 连接)
      idle-timeout: 600000               # 空闲 10min 回收
      validation-timeout: 5000           # 连接有效性校验超时
      leak-detection-threshold: 60000    # 连接被持有 >60s 记 WARN 堆栈(定位泄漏)
      initialization-fail-timeout: 1     # 启动不因连接池预热阻塞

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        # Week 41 D6 Step G2:ADR-007 Schema 隔离(零迁移策略)
        # schema 由 TenantIdentifierResolver 提供,SET search_path 由
        # SchemaTenantConnectionProvider 执行;默认租户映射 public → 存量数据无需迁移
        multiTenancy: SCHEMA  # Week 42 G2 完成后启用(同上下面的 multi_tenant_* 配置)
        # ⏭️ Week 41 G2 partial — SchemaTenantConnectionProvider + TenantIdentifierResolver
        # 已写但未启用(Hibernate Class.forName 创建实例时 Spring Bean 尚未注入 DataSource,
        # 需用 ServiceContributor 桥接,推迟到 Week 42 G2 完成)
        # multi_tenant_connection_provider: com.nocobase.tenant.SchemaTenantConnectionProvider
        # multi_tenant_identifier_resolver: com.nocobase.tenant.TenantIdentifierResolver
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${JAVA_PORT:8080}
  shutdown: graceful

# JWT 配置
app:
  # R09: 连接池监控参数
  pool-monitor:
    warn-utilization: 0.85     # 活跃连接占比达到 85% 触发 WARN
    interval-ms: 30000        # 扫描间隔 30s
  # Stage 1 安全收口:ACL fail-open 开关。
  # false(默认)=fail-closed(无策略/异常一律拒绝);true=灰度回滚窗口用。
  acl:
    fail-open: ${ACL_FAIL_OPEN:false}

  # 钉钉集成配置(Week 1-4 Phase 4)
  # 凭证从钉钉开发者后台获取: https://open-dev.dingtalk.com
  dingtalk:
    app-key: ${DINGTALK_APP_KEY:}
    app-secret: ${DINGTALK_APP_SECRET:}
    agent-id: ${DINGTALK_AGENT_ID:}
    corp-id: ${DINGTALK_CORP_ID:}
  jwt:
    secret: ${JWT_SECRET:dev_jwt_secret_at_least_32_characters_long_for_hs256}
    # Week 42 R10:轮换期间保留上一个签名密钥,旧 kid 仍可验证
    # 真实部署应由 KMS 注入 — 本地测试可留空
    previous-secret: ${JWT_PREVIOUS_SECRET:}
    access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
  # Week 41 复核 D1.4:附件对象存储(MinIO / S3 兼容)
  # 默认关闭 —— 未启用时附件端点返 501,与改造前一致,不会因缺少 MinIO 而启动失败
  storage:
    minio:
      enabled: ${MINIO_ENABLED:false}
      endpoint: ${MINIO_ENDPOINT:}
      access-key: ${MINIO_ACCESS_KEY:}
      secret-key: ${MINIO_SECRET_KEY:}
      bucket: ${MINIO_BUCKET:nocobase}

# Actuator(健康检查)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Springdoc / Swagger UI(Week 14.5)
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    url: /v3/api-docs
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
    doc-expansion: none
    persist-authorization: true
  show-actuator: false
  packages-to-scan: com.nocobase
  default-produces-media-type: application/json

# 日志
logging:
  level:
    root: INFO
    com.nocobase: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      # Week 42 D5.2: H2 测试环境无 Flyway → 用 create-drop 自动建表
      # (生产 dev profile 仍用 validate + Flyway,保持 schema 一致性)
      ddl-auto: create-drop

---
# Docker profile — 与 dev 一样但日志更克制
spring:
  config:
    activate:
      on-profile: docker
  jpa:
    show-sql: false

logging:
  level:
    com.nocobase: INFO
