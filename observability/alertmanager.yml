# ============================================================
#  AlertManager 配置（PHASE104 T7.3）—— 告警路由 + 通知
#
#  通知渠道：
#    1. webhook → /api/alerts/webhook（Python 服务，持久化 + 推送）
#    2. email   → 本地 sendmail（Dockerfile 已安装 msmtp，CI/CD 需配 SMTP）
#
#  路由规则（按 severity 分级）：
#    - critical → webhook + email（立即通知）
#    - warning  → webhook（仅落盘，供值班查看）
# ============================================================

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: 'default-webhook'

  # 分级路由
  routes:
    - match:
        severity: critical
      receiver: 'critical-webhook-email'
      repeat_interval: 1h

    - match:
        severity: warning
      receiver: 'warning-webhook'

receivers:
  - name: 'default-webhook'
    webhook_configs:
      - url: 'http://backend-python:8000/api/alerts/webhook'
        send_resolved: true

  - name: 'critical-webhook-email'
    webhook_configs:
      - url: 'http://backend-python:8000/api/alerts/webhook'
        send_resolved: true
    email_configs:
      # PHASE104 审计修正（实测复现两次）：
      #   1) shell 风格 ${VAR:-default} → 报 "too many colons in address"
      #   2) 纯 ${VAR} 引用 → Alertmanager 不做环境变量展开，报 "missing port"
      # 故此处必须写死值。当前栈内没有 SMTP 中继，localhost:25 实际不可用，
      # 仅保留结构；若需真实邮件告警，请直接改本文件（或引入 entrypoint 模板化）。
      - to: 'devops@nocobase.local'
        from: 'nocobase-alerts@nocobase.local'
        smarthost: 'localhost:25'
        require_tls: false

  - name: 'warning-webhook'
    webhook_configs:
      - url: 'http://backend-python:8000/api/alerts/webhook'
        send_resolved: true
