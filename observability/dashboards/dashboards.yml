# ============================================================
#  Grafana Dashboard Provider（PHASE104 审计修正）
#
#  必须位于 provisioning/dashboards/ 才会被 Grafana 读取。
#  本目录被 compose 整体挂载到 /etc/grafana/provisioning/dashboards，
#  因此 provider 与 nocobase-overview.json 一起就位，Grafana 启动即导入面板。
# ============================================================

apiVersion: 1

providers:
  - name: 'NocoBase'
    orgId: 1
    folder: 'NocoBase'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
