# Test profile — H2 in-memory + JPA create-drop + Flyway disabled + 真实 password encoder
# 用于 E2E 集成测试和 CI
# PHASE96 T1: 项目里 32 个实体用了 columnDefinition="jsonb"（生产表由 Flyway 建，与 DDL 无关），
# 而 H2 不识别 jsonb 类型名，会让 @DataJpaTest 建表失败。INIT 在 H2 里建一个 JSONB 域
# （映射到 CLOB）即可识别 —— 分号在 Spring properties 里必须转义为 \\;。
spring.datasource.url=jdbc:h2:mem:nocobase_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE DOMAIN IF NOT EXISTS JSONB AS CLOB\\;
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA: 用 entity 自动建表,无需 Flyway
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Flyway disable: PG-specific migrations 与 H2 不兼容
spring.flyway.enabled=false

# JWT (E2E 测试需要)
app.jwt.secret=ci_jwt_secret_at_least_32_characters_long_for_hs256_algorithm
app.jwt.access-ttl-minutes=15
app.jwt.refresh-ttl-days=7

# CORS (allow E2E localhost)
app.cors.allowed-origins=http://localhost:8080,http://localhost:5173

# Disable RabbitMQ auto-startup to avoid AuthenticationFailureException
spring.rabbitmq.listener.simple.auto-startup=false
springdoc.api-docs.enabled=false

# PHASE99 T1: Integration credential encryption master key (test dedicated, non-production key, openssl rand -base64 32 format)
integration.credential.master-key=MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=

# Logging
logging.level.com.nocobase=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.security=WARN
