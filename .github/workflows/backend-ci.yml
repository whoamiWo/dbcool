name: Backend CI

# 触发条件:push 到 main / 任何 PR
on:
  push:
    branches: [main]
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend-java/**'
      - '.github/workflows/backend-ci.yml'

# 取消进行中的旧 run
concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (mvn verify + JaCoCo coverage gates)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # 单元测试 mock-based + E2E H2 in-memory,不需要外部服务
    # Flyway 在 test profile 中被禁用(Week 35),JPA 用 entity 自动建表

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run mvn verify (Tests + JaCoCo coverage gates)
        working-directory: backend-java
        run: mvn -B verify

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-coverage-report
          path: backend-java/target/site/jacoco/
          retention-days: 30

      - name: Fail if coverage report not generated
        if: failure()
        run: |
          echo "::error::mvn verify failed (likely coverage gate or test failure). See logs above."
          exit 1

      - name: Summarize coverage
        if: success()
        working-directory: backend-java
        run: |
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # 抓 BUNDLE 覆盖率
          COV=$(grep -oE 'ctr2">[0-9]+%' target/site/jacoco/index.html | head -1 | grep -oE '[0-9]+')
          TESTS=$(mvn test 2>&1 | grep -oE 'Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+' | head -1)
          echo "- **Bundle coverage**: ${COV}%" >> $GITHUB_STEP_SUMMARY
          echo "- **Tests**: ${TESTS}" >> $GITHUB_STEP_SUMMARY
