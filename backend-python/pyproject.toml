[project]
name = "nocobase-py"
version = "2.1.2"
description = "NocoBase AI 增强 / 集成 / 异步任务层"
authors = [
    { name = "Cline", email = "noreply@nocobase.local" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # Web 框架
    # PHASE104 审计修正：此前误判"fastapi 0.141 存在路由注册 bug"并声称降级，
    # 实则 (1) 误用了 app.routes[].path —— fastapi >=0.142 起路由嵌套在
    # _IncludedRouter 内，该属性不再平铺可取；(2) 当时本地是 fastapi 0.141.1
    # 与 starlette 1.7.0 的不兼容组合。功能测试（TestClient 真调用）证明
    # 0.115.12 与 0.142.2 下 /alerts/webhook、/alerts/list 均正常返回 200。
    # 项目无 uv.lock，故在此加**上限约束**保证可复现：锁定已验证的 0.142.x，
    # 排除未经本项目验证的未来版本。
    "fastapi>=0.115.0,<0.143.0",
    "uvicorn[standard]>=0.32.0",
    # 数据校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    # JWT
    "python-jose[cryptography]>=3.3.0",
    # 数据库 (Week 4+ 用)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    # CORS
    # 与 fastapi 版本配套：1.7.0 已随 fastapi 0.142.2 验证（容器内实测 healthy），
    # 上限排除未验证的未来大版本。见上方 fastapi 注释（PHASE104 审计修正）。
    "starlette>=0.41.0,<2.0.0",
    # Redis (R11 多副本一致性必需)
    "redis[hiredis]>=5.2.0",
    # Form data 解析 (Mattermost outgoing webhook 走 form-urlencoded)
    "python-multipart>=0.0.9",
    # MinIO 对象存储客户端（PHASE 68 备份媒体资产）
    "minio>=7.2.0",
    # PHASE10: 报表导出（企业门槛三件套 —— Excel / PDF）
    # 由 Java 侧编排取数后调用本服务生成文件；Python 不直连业务库。
    "openpyxl>=3.1.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
# PHASE 57: 真实语义向量（可选）。torch 体积大（~800MB），故不进主依赖；
# 需要真语义检索时用 `uv sync --extra semantic` 安装，代码会自动优先使用
# （未安装时回退确定性哈希，接口仍可用）。基础镜像为 python:3.12-slim(glibc)，可安装。
semantic = [
    "sentence-transformers>=3.0.0",
    # 显式声明 torch，使下方 [tool.uv.sources] 的 CPU 源覆盖生效
    # （仅作为传递依赖时 uv 不会应用 source override）
    "torch>=2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "schemathesis>=3.27.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocobase_py"]

[[tool.uv.index]]
# PHASE 57: 默认 PyPI 的 torch 会连带拉取约 2GB 的 nvidia-* CUDA 包。
# 本项目为 CPU 推理（768 维小模型），显式指定 PyTorch CPU 源可显著减小
# 镜像体积与构建耗时（去掉 CUDA 依赖）。仅对 torch 生效（explicit = true）。
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "DTZ", "PIE", "PT", "RET", "SIM"]
ignore = [
    "E501",   # 行长度由 formatter 管，且注释/URL 常有长行
    "DTZ003", # datetime.utcnow() 是业务约定（"当前 UTC 毫秒时间戳"，非 POSIX 时间，用 now() 会更绕）
]

[tool.ruff.lint.flake8-bugbear]
# PHASE131: FastAPI 依赖注入惯例 —— `x: T = Depends(...)` 是框架要求的写法，非 bug。
# 精确豁免这些调用（而非整个禁用 B008），保留规则对其他场景的检测力。
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
    "fastapi.security.HTTPBearer",
]

[tool.ruff.lint.flake8-pytest-style]
# PHASE131: 不强求 pytest.raises 必须带 match —— 改动既有测试断言有破坏风险，
# 且"异常类型正确"本身已是有效断言。设为空列表即不对任何异常类型要求 match。
raises-require-match-for = []

[tool.ruff.lint.per-file-ignores]
# PHASE131: AlertManager webhook payload 的字段名由外部契约固定为 mixedCase
# （groupKey / externalURL / commonLabels 等），改为 snake_case 会导致与 AlertManager 集成错位。
"src/nocobase_py/routers/alerts.py" = ["N815"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
