# CRDT 服务端合并服务
# 提供 Yjs 文档的服务端合并 + 持久化功能
# 依赖 PostgreSQL (nocobase-postgres)，建议与主集群同 VPC

apiVersion: apps/v1
kind: Deployment
metadata:
  name: crdt-service
  labels:
    app: crdt-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crdt-service
  template:
    metadata:
      labels:
        app: crdt-service
    spec:
      containers:
        - name: crdt-service
          image: node:20-alpine
          imagePullPolicy: IfNotPresent
          workingDir: /app
          ports:
            - containerPort: 3100
          env:
            # B7 修复：修复前引用不存在的 Secret「nocobase-secrets」（复数+小写），
            # 实际 00-base.yaml 定义的是「nocobase-secret」（单数），导致 Pod 起不来。
            # PG_HOST/PG_DB/PG_PORT 走 ConfigMap nocobase-config（非敏感值），
            # 只有 PG_USER/PG_PASSWORD 走 Secret nocobase-secret（敏感值）。
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: nocobase-config
                  key: POSTGRES_HOST
            - name: PG_PORT
              valueFrom:
                configMapKeyRef:
                  name: nocobase-config
                  key: POSTGRES_PORT
            - name: PG_DB
              valueFrom:
                configMapKeyRef:
                  name: nocobase-config
                  key: POSTGRES_DB
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: nocobase-secret
                  key: POSTGRES_USER
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nocobase-secret
                  key: POSTGRES_PASSWORD
            - name: PORT
              value: "3100"
          volumeMounts:
            - name: yjs-store
              mountPath: /app/yjs-store
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3100
            initialDelaySeconds: 10
            periodSeconds: 30
      volumes:
        - name: yjs-store
          persistentVolumeClaim:
            claimName: crdt-service-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: crdt-service
  labels:
    app: crdt-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 3100
      name: http
  selector:
    app: crdt-service

---
# 持久化卷 (Yjs 文档状态)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: crdt-service-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard