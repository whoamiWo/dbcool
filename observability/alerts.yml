# ============================================================
#  告警规则（PHASE100 T7）—— 由 k8s/06-monitoring.yaml 移植到 Compose
#
#  覆盖三类（任务书 T7 最小集）：
#    1. 服务 down
#    2. 5xx 比例
#    3. P99 延迟
# ============================================================

groups:
  - name: nocobase.rules
    rules:
      # ---- 1. 可用性：Java 后端 down ----
      - alert: NocoBaseJavaDown
        expr: up{job="backend-java"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Java 后端实例不可用"
          description: "实例 {{ $labels.instance }} 已掉线超过 2 分钟"

      # ---- 2. 5xx 错误率 ----
      - alert: NocoBaseHighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum(rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "5xx 错误率超过 5%"
          description: "当前错误率 {{ $value | humanizePercentage }}，持续 5 分钟"

      # ---- 3. P99 延迟（依赖 application.yml 的 percentiles-histogram）----
      - alert: NocoBaseHighLatency
        expr: |
          histogram_quantile(0.99,
            sum(rate(http_server_requests_seconds_bucket[5m])) by (le)
          ) > 3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "HTTP P99 延迟超过 3s"
          description: "P99 = {{ $value }}s，持续 10 分钟"
