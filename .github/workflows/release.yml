name: Release

# tag 触发的发布流水线。每个架构只推 digest，manifest job 统一组装并校验四镜像。
# 禁止不同架构直接向同一个版本 tag 推送：后推者会覆盖先推者，而不是形成多架构 manifest。
# 任一架构失败均阻断 Release，不用 continue-on-error 把单架构产物冒充完整发布。

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # 创建 Release 需要
  packages: write   # 推 ghcr.io 镜像需要

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, platform: linux/amd64 }
          - { arch: arm64, platform: linux/arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21（backend-java 构建需要；含 Maven 缓存）
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Set up QEMU（arm64 构建需要）
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version consistency（发布前置门禁）
        run: |
          set -euo pipefail
          APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          tag_prefix="v${APP_VERSION}"
          if [[ "$GITHUB_REF_NAME" == "$tag_prefix" ]]; then
            :
          elif [[ "$GITHUB_REF_NAME" == "$tag_prefix-"* ]]; then
            retry_suffix="${GITHUB_REF_NAME#"$tag_prefix"-}"
            if ! [[ "$retry_suffix" =~ ^[1-9][0-9]*$ ]]; then
              echo "❌ invalid release retry suffix: ${GITHUB_REF_NAME}" >&2
              exit 2
            fi
          else
            echo "❌ tag ${GITHUB_REF_NAME} 与 VERSION ${APP_VERSION} 不一致" >&2
            exit 2
          fi
          python3 scripts/version-consistency-verify.py

      - name: Resolve application revision
        run: |
          set -euo pipefail
          if [ -f .release-app-revision ]; then
            revision="$(tr -d '[:space:]' < .release-app-revision)"
          else
            revision="$(git rev-parse HEAD)"
          fi
          if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "❌ invalid application revision: $revision" >&2
            exit 2
          fi
          printf '%s\n' "$revision" > "${RUNNER_TEMP}/revision"
          echo "APP_REVISION=$revision" >> "$GITHUB_ENV"
          echo "Application revision: $revision" >> "$GITHUB_STEP_SUMMARY"

      - name: Build & push four architecture digests
        env:
          IMAGE_REGISTRY: ghcr.io/whoamiwo/dbcool
          PLATFORM: ${{ matrix.platform }}
          PUSH_BY_DIGEST: "1"
        run: |
          set -euo pipefail
          # OCI version 固定为 VERSION；GHCR tag 保留重试后缀，避免覆盖原版本 tag。
          export APP_VERSION="$(tr -d '[:space:]' < VERSION)"
          export APP_IMAGE_TAG="${GITHUB_REF_NAME#v}"
          bash scripts/build-images.sh
          : > "${RUNNER_TEMP}/images"
          for svc in backend-java backend-python crdt-service frontend; do
            # push-by-digest 不创建版本 tag；digest 只能来自本次构建的 metadata。
            digest="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["containerimage.digest"])' "${RUNNER_TEMP}/${svc}.json")"
            test -n "$digest"
            echo "${svc}@${digest}" >> "${RUNNER_TEMP}/images"
          done
          cat "${RUNNER_TEMP}/images"

      - name: Upload architecture digests and revision
        uses: actions/upload-artifact@v4
        with:
          name: release-images-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/images
            ${{ runner.temp }}/revision
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish and verify multi-arch manifests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download architecture digests
        uses: actions/download-artifact@v4
        with:
          path: digests

      - name: Verify matching application revisions
        run: |
          set -euo pipefail
          revisions=()
          for arch in amd64 arm64; do
            file="digests/release-images-${arch}/revision"
            test -f "$file"
            revision="$(tr -d '[:space:]' < "$file")"
            if ! [[ "$revision" =~ ^[0-9a-f]{40}$ ]]; then
              echo "❌ invalid ${arch} application revision: $revision" >&2
              exit 2
            fi
            revisions+=("$revision")
          done
          if [ "${revisions[0]}" != "${revisions[1]}" ]; then
            echo "❌ architecture revisions differ: amd64=${revisions[0]} arm64=${revisions[1]}" >&2
            exit 2
          fi
          echo "APP_REVISION=${revisions[0]}" >> "$GITHUB_ENV"
          echo "Application revision: ${revisions[0]}" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create four multi-arch manifests
        run: |
          set -euo pipefail
          app_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF_NAME" == "v${app_version}" ]]; then
            image_tag="$app_version"
          else
            retry_suffix="${GITHUB_REF_NAME#"v${app_version}"-}"
            if ! [[ "$retry_suffix" =~ ^[1-9][0-9]*$ ]]; then
              echo "❌ invalid retry tag: $GITHUB_REF_NAME" >&2
              exit 2
            fi
            image_tag="${app_version}-${retry_suffix}"
          fi
          for svc in backend-java backend-python crdt-service frontend; do
            refs=()
            for arch in amd64 arm64; do
              line="$(grep "^${svc}@" "digests/release-images-${arch}/images")"
              refs+=("ghcr.io/whoamiwo/dbcool/dbcool-${line}")
            done
            image="ghcr.io/whoamiwo/dbcool/dbcool-${svc}:${image_tag}"
            docker buildx imagetools create --tag "$image" "${refs[@]}"
          done

      - name: Verify architectures and OCI provenance
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "${APP_REVISION:-}"
          expected_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$APP_VERSION" == "v${expected_version}-"* ]]; then
            retry_suffix="${APP_VERSION#"v${expected_version}"-}"
            if ! [[ "$retry_suffix" =~ ^[1-9][0-9]*$ ]]; then
              echo "❌ invalid release retry suffix: $APP_VERSION" >&2
              exit 2
            fi
            image_tag="${expected_version}-${retry_suffix}"
          elif [[ "$APP_VERSION" == "v${expected_version}" ]]; then
            image_tag="$expected_version"
          else
            echo "❌ release tag $APP_VERSION differs from VERSION $expected_version" >&2
            exit 2
          fi
          for svc in backend-java backend-python crdt-service frontend; do
            image="ghcr.io/whoamiwo/dbcool/dbcool-${svc}:${image_tag}"
            docker buildx imagetools inspect "$image" --format '{{json .}}'
            docker buildx imagetools inspect "$image" --raw > manifest.json
            python3 - "$image" "$APP_REVISION" "$expected_version" <<'PY'
          import json, subprocess, sys

          image, revision, version = sys.argv[1:]
          manifest = json.load(open("manifest.json", encoding="utf-8"))
          platforms = {
              f"{entry['platform']['os']}/{entry['platform']['architecture']}": entry["digest"]
              for entry in manifest["manifests"]
          }
          if set(platforms) != {"linux/amd64", "linux/arm64"}:
              raise SystemExit(f"unexpected platforms: {sorted(platforms)}")

          for platform, digest in sorted(platforms.items()):
              child_json = subprocess.check_output(
                  ["docker", "buildx", "imagetools", "inspect", f"{image}@{digest}", "--format", "{{json .Image}}"],
                  text=True,
              )
              child = json.loads(child_json)
              expected_arch = platform.rsplit("/", 1)[1]
              if child.get("architecture") != expected_arch or child.get("os") != "linux":
                  raise SystemExit(f"unexpected image config platform for {platform}: {child.get('os')}/{child.get('architecture')}")

              labels = (child.get("config") or {}).get("Labels") or {}
              expected = {
                  "org.opencontainers.image.revision": revision,
                  "org.opencontainers.image.version": version.removeprefix("v"),
              }
              for key, value in expected.items():
                  if labels.get(key) != value:
                      raise SystemExit(f"{platform} {key}: {labels.get(key)!r} != {value!r}")
              print(f"{image} {platform} {digest}: OCI labels verified")
          PY
          done

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: manifest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Release Notes（版本不存在则失败）
        run: |
          set -euo pipefail
          app_version="$(tr -d '[:space:]' < VERSION)"
          app_revision="$(tr -d '[:space:]' < .release-app-revision)"
          tag_commit="$(git rev-parse HEAD)"
          image_tag="${GITHUB_REF_NAME#v}"
          retry_suffix=""
          if [[ "$GITHUB_REF_NAME" != "v${app_version}" ]]; then
            retry_suffix="${GITHUB_REF_NAME#"v${app_version}"-}"
            if ! [[ "$retry_suffix" =~ ^[1-9][0-9]*$ ]]; then
              echo "❌ invalid release retry tag: $GITHUB_REF_NAME" >&2
              exit 2
            fi
          fi
          python3 scripts/extract-changelog.py --version "$app_version" > /tmp/RELEASE_NOTES.md
          test -s /tmp/RELEASE_NOTES.md
          cat >> /tmp/RELEASE_NOTES.md <<NOTES

          ## 发布对象与已知限制

          - 发布 tag：\`${GITHUB_REF_NAME}\`；tag commit：\`${tag_commit}\`。
          - 应用 revision：\`${app_revision}\`。tag commit 只附带发布 CI/backport 变更，应用代码对应上述 revision。
          - 钉钉外推、飞书同步、OIDC 尚未完成真实外部验收，相关生产开关保持关闭。
          - JWT 密钥轮换在 2.1.5 默认禁用。
          - H12 quota flush 事务修复与 H11 alerts resolved 落盘修复不在 2.1.5，属于 2.1.6；quota DB 快照 WARN 与 alerts.resolved 历史索引遗留仍是已知问题。
          - ROW/CUSTOM 聚合 403 为设计行为；历史 created_by 不自动回填，需 reindex。
          NOTES
          if [[ -n "$retry_suffix" ]]; then
            cat >> /tmp/RELEASE_NOTES.md <<NOTES

          ## 重试说明

          本次使用重试 tag \`${GITHUB_REF_NAME}\`，GHCR 镜像 tag 使用 \`${image_tag}\`，OCI version 保持 \`${app_version}\`。
          - \`v${app_version}\` 首次尝试在初始构建失败，未推送镜像。
          - \`v${app_version}-1\` 的 amd64/arm64 构建成功并推送了 digest-only 镜像；manifest job 因未 checkout、找不到 VERSION 而失败，未创建版本化多架构 manifest 或 GitHub Release。未标记的 digest 产物可能仍留在 GHCR。
          先前 tag 均未移动。
          NOTES
          fi

      - name: Generate checksums
        run: |
          set -euo pipefail
          mkdir -p dist
          cp /tmp/RELEASE_NOTES.md "dist/RELEASE_NOTES-${GITHUB_REF_NAME}.md"
          (cd dist && sha256sum "RELEASE_NOTES-${GITHUB_REF_NAME}.md" > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/RELEASE_NOTES.md
          files: |
            dist/RELEASE_NOTES-*.md
            dist/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
