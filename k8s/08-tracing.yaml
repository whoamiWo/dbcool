# ============================================================
#  分布式追踪 —— Jaeger（all-in-one，开发/小规模生产可用）
#  PHASE 56 P1-2
#
#  OTLP endpoint：jaeger-collector:4318（HTTP）或 :4317（gRPC）
#  后端通过 OTEL_EXPORTER_OTLP_ENDPOINT 环境变量注入
# ============================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: nocobase
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
          ports:
            - containerPort: 16686
              name: ui
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            limits:
              memory: 512Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-collector
  namespace: nocobase
spec:
  selector:
    app: jaeger
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
