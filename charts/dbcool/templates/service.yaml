apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbcool.fullname" . }}-backend-java
  labels:
    {{- include "dbcool.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: backend-java
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbcool.fullname" . }}-backend-python
  labels:
    {{- include "dbcool.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  selector:
    app: backend-python
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbcool.fullname" . }}-crdt-service
  labels:
    {{- include "dbcool.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: 3100
      name: http
  selector:
    app: crdt-service
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "dbcool.fullname" . }}-frontend
  labels:
    {{- include "dbcool.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      name: http
  selector:
    app: frontend
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "dbcool.fullname" . }}-ingress
  labels:
    {{- include "dbcool.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "dbcool.fullname" . }}-frontend
                port:
                  number: 80
{{- end }}
