[project]
name = "nocobase-py"
version = "0.0.1"
description = "NocoBase AI 增强 / 集成 / 异步任务层"
authors = [
    { name = "Cline", email = "noreply@nocobase.local" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 数据校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    # JWT
    "python-jose[cryptography]>=3.3.0",
    # 数据库(Week 4+ 用)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    # CORS
    "starlette>=0.41.0",
    # Redis (R11 多副本一致性必需)
    "redis[hiredis]>=5.2.0",
    # Form data 解析(Mattermost outgoing webhook 走 form-urlencoded)
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# PHASE 57: 真实语义向量（可选）。torch 体积大（~800MB），故不进主依赖；
# 需要真语义检索时用 `uv sync --extra semantic` 安装，代码会自动优先使用
# （未安装时回退确定性哈希，接口仍可用）。基础镜像为 python:3.12-slim(glibc)，可安装。
semantic = [
    "sentence-transformers>=3.0.0",
    # 显式声明 torch，使下方 [tool.uv.sources] 的 CPU 源覆盖生效
    # （仅作为传递依赖时 uv 不会应用 source override）
    "torch>=2.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "schemathesis>=3.27.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocobase_py"]

[[tool.uv.index]]
# PHASE 57: 默认 PyPI 的 torch 会连带拉取约 2GB 的 nvidia-* CUDA 包。
# 本项目为 CPU 推理（768 维小模型），显式指定 PyTorch CPU 源可显著减小
# 镜像体积与构建耗时（去掉 CUDA 依赖）。仅对 torch 生效（explicit = true）。
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "DTZ", "PIE", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
