[project]
name = "nocobase-py"
version = "0.0.1"
description = "NocoBase AI 增强 / 集成 / 异步任务层"
authors = [
    { name = "Cline", email = "noreply@nocobase.local" }
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # Web 框架
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # 数据校验
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    # HTTP 客户端
    "httpx>=0.27.0",
    # JWT
    "python-jose[cryptography]>=3.3.0",
    # 数据库(Week 4+ 用)
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.30.0",
    # CORS
    "starlette>=0.41.0",
    # Redis (R11 多副本一致性必需)
    "redis[hiredis]>=5.2.0",

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "respx>=0.21.0",
    "schemathesis>=3.27.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nocobase_py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "DTZ", "PIE", "PT", "RET", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
