[project]
name = "nocobase-contract-tests"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest>=8.3.0",
    "pyyaml>=6.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
testpaths = ["."]
asyncio_mode = "auto"
markers = [
    "contract: 契约一致性测试",
    "integration: 需要服务运行的集成测试",
]
